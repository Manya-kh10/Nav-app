<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Navora</title>
    <meta name="theme-color" content="#0b5fff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <link rel="stylesheet" href="/css/app.css">
</head>

<body>
    <header class="app-header">
        <div class="header-brand">
            <span class="header-icon">🧭</span>
            <h1>Navora</h1>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <button id="toggle-search-btn" class="btn-toggle-search" type="button">🔍 Route</button>
            <a href="/driver.html" class="driver-mode-link">🚗 Driver Mode</a>
        </div>
    </header>

    <div class="app-layout">
        <!-- Route Planning Sidebar / Drawer -->
        <aside class="app-sidebar" id="app-sidebar">
            <section class="panel" id="route-panel">
                <div class="field">
                    <label for="from-input">From (Origin)</label>
                    <div class="row">
                        <input id="from-input" placeholder="e.g. MG Road Metro Station">
                        <button id="from-search" type="button">Search</button>
                    </div>
                    <div id="from-chosen" class="chosen"></div>
                    <div id="from-results" class="results"></div>
                </div>

                <div class="field">
                    <label for="to-input">To (Destination)</label>
                    <div class="row">
                        <input id="to-input" placeholder="e.g. Indiranagar Metro Station">
                        <button id="to-search" type="button">Search</button>
                    </div>
                    <div id="to-chosen" class="chosen"></div>
                    <div id="to-results" class="results"></div>
                </div>

                <div class="row">
                    <select id="mode">
                        <option value="walk">Walk</option>
                    </select>
                    <button id="go" class="primary" type="button">Get Route</button>
                </div>

                <div id="status" role="status"></div>
            </section>
        </aside>

        <!-- Main Map Canvas -->
        <main class="map-container">
            <div id="map"></div>
        </main>

        <!-- Bottom Sheet (Navigation, Voice Chat, Steps & Simulation) -->
        <section class="mobile-bottom-sheet" id="mobile-bottom-sheet">
            <div class="bottom-sheet-handle" id="sheet-handle" title="Tap to expand"></div>

            <div id="nav-next">Get a route, then start navigation or simulation.</div>
            <div id="nav-meta"></div>

            <button id="passenger-card-btn" class="passenger-card-btn" style="display:none;" type="button">
                🪪 Auto / Driver Card (Kannada)
            </button>

            <!-- Voice / Spoken Assistant Query Box -->
            <div class="row chat">
                <input id="chat-input" placeholder="Ask: next turn? am I on route? eshtu time?">
                <button id="chat-send" type="button">Ask</button>
            </div>
            <div id="chat-answer"></div>

            <!-- Simulation & Replay Controls -->
            <div class="row sim">
                <button id="sim-walk" disabled type="button">Simulate walk</button>
                <button id="sim-wrong" disabled type="button">Simulate wrong turn</button>
                <button id="gps-live" disabled type="button">Live GPS</button>
                <button id="sim-stop" disabled type="button">Stop</button>
            </div>

            <!-- Summary & Turn-by-Turn Steps -->
            <div style="margin-top: 12px; border-top: 1px solid var(--border-color); padding-top: 10px;">
                <div id="summary"></div>
                <div id="traffic-attr" style="font-size: 0.75rem; color: #888; margin-top: 4px; display: none;">Traffic data © TomTom · Privacy: route coordinates sent only for real-time delay calculations.</div>
                <ol id="steps"></ol>
            </div>

            <ul id="nav-log"></ul>
        </section>
    </div>

    <!-- Passenger / Driver Card Modal -->
    <div id="passenger-modal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-badge">Auto / Cab Driver Card · ಆಟೋ / ಕ್ಯಾಬ್</span>
                <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="driver-lead">ದಯವಿಟ್ಟು ಇಲ್ಲಿಗೆ ಕರೆದುಕೊಂಡು ಹೋಗಿ (Please take me to):</div>
                <div id="card-kn" class="kannada-dest"></div>
                <div id="card-en" class="english-dest"></div>
                <div id="card-landmark" class="landmark-dest" style="display:none;"></div>
            </div>
            <div class="modal-footer">
                <button id="card-speak-btn" class="speak-dest-btn" type="button">
                    🔊 ಧ್ವನಿಯಲ್ಲಿ ಹೇಳಿ (Speak in Kannada)
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/voice.js"></script>
</body>

</html>
