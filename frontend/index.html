<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bangalore Voice Nav</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <link rel="stylesheet" href="/css/app.css">
</head>

<body>
    <header>
        <h1>Bangalore Voice Nav</h1>
    </header>

    <section class="panel">
        <div class="field">
            <label for="from-input">From</label>
            <div class="row">
                <input id="from-input" placeholder="e.g. MG Road Metro Station">
                <button id="from-search">Search</button>
            </div>
            <div id="from-chosen" class="chosen"></div>
            <div id="from-results" class="results"></div>
        </div>

        <div class="field">
            <label for="to-input">To</label>
            <div class="row">
                <input id="to-input" placeholder="e.g. Indiranagar Metro Station">
                <button id="to-search">Search</button>
            </div>
            <div id="to-chosen" class="chosen"></div>
            <div id="to-results" class="results"></div>
        </div>

        <div class="row">
            <select id="mode">
                <option value="walk">Walk</option>
                <option value="drive">Drive</option>
            </select>
            <button id="go" class="primary">Get route</button>
        </div>
        <div class="row sim">
            <button id="sim-walk" disabled>Simulate walk</button>
            <button id="sim-wrong" disabled>Simulate wrong turn</button>
            <button id="gps-live" disabled>Live GPS</button>
            <button id="sim-stop" disabled>Stop</button>
        </div>
        <div id="status" role="status"></div>
    </section>

    <div id="map"></div>

    <section class="panel" id="nav">
        <div id="nav-next">Get a route, then start navigation or simulation.</div>
        <div id="nav-meta"></div>
        <button id="passenger-card-btn" class="passenger-card-btn" style="display:none;">🪪 Auto / Driver Card (Kannada)</button>
        <div class="row chat">
            <input id="chat-input" placeholder="Ask: next turn? am I on route? kitna time lagega?">
            <button id="chat-send">Ask</button>
        </div>
        <div id="chat-answer"></div>
        <ul id="nav-log"></ul>
    </section>

    <section class="panel">
        <div id="summary"></div>
        <ol id="steps"></ol>
    </section>

    <!-- Passenger / Driver Card Modal -->
    <div id="passenger-modal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-badge">Auto / Cab Driver Card · ಆಟೋ / ಕ್ಯಾಬ್</span>
                <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="driver-lead">ದಯವಿಟ್ಟು ಇಲ್ಲಿಗೆ ಕರೆದುಕೊಂಡು ಹೋಗಿ (Please take me to):</div>
                <div id="card-kn" class="kannada-dest"></div>
                <div id="card-en" class="english-dest"></div>
                <div id="card-landmark" class="landmark-dest" style="display:none;"></div>
            </div>
            <div class="modal-footer">
                <button id="card-speak-btn" class="speak-dest-btn">
                    🔊 ಧ್ವನಿಯಲ್ಲಿ ಹೇಳಿ (Speak in Kannada)
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/voice.js"></script>
</body>

</html>
