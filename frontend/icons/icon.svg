      <stop offset="0%" stop-color="#0b5fff"/>
      <stop offset="100%" stop-color="#002b80"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
